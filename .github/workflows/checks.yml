name: Project checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install verification dependencies
        run: |
          python -m pip install numpy==2.5.3
          python -m pip install -r requirements-dev.txt
          npm ci --ignore-scripts
      - name: Python lint
        run: python -m ruff check --output-format=github .
      - name: Python game and neural integration
        run: python -m unittest discover -s tests -v
      - name: Browser physics match Python
        run: npm test
      - name: Generated reports and input frames are current
        run: python scripts/build_site_data.py --check
      - name: Frontend and documentation formatting
        run: npm run format:check
      - name: Real-browser interactions and responsive layouts
        run: npm run test:browser
      - name: Preserve browser check and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-check
          path: |
            results/site-*.png
            results/site-browser-check.json
            results/browser-chrome.log
          retention-days: 7
          if-no-files-found: ignore
